<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Gallery | Avinash Photography</title>
    <meta name="description" content="Sleek ethnic wear campaigns, product showcases, and elegant lifestyle catalog photography.">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <!-- Noise Texture Overlay -->
    <div class="noise-overlay"></div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <a href="index.html" class="logo">Avinash.</a>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#portfolio">Work</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
        <a href="index.html#contact" class="nav-cta">Let's Connect</a>
        <div class="hamburger" aria-label="Toggle menu" role="button">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </nav>

    <!-- Portfolio Section -->
    <section class="section" style="padding-top: 10rem;">
        <div class="container">
            <div class="section-header reveal">
                <h2 class="heading-md">Brand Gallery</h2>
                <p style="font-size: 1.25rem; color: var(--text-secondary); font-family: 'Playfair Display', serif; font-style: italic;">Sleek ethnic wear campaigns, product showcases, and elegant lifestyle catalog photography.</p>
            </div>
            
            <div class="editorial-masonry" id="gallery">
                <div class="masonry-item reveal" style="transition-delay: 0.1s;">
                    <div class="print-frame">
                        <img src="assets/brand_1.jpg" alt="Ethnic Wear Brand Campaign - Portrait" class="print-img">
                    </div>
                </div>
                <div class="masonry-item reveal" style="transition-delay: 0.2s;">
                    <div class="print-frame">
                        <img src="assets/brand_2.jpg" alt="Ethnic Wear Brand Campaign - Candid" class="print-img">
                    </div>
                </div>
                <div class="masonry-item reveal" style="transition-delay: 0.30000000000000004s;">
                    <div class="print-frame">
                        <img src="assets/brand_3.jpg" alt="Ethnic Wear Brand Campaign - Pose" class="print-img">
                    </div>
                </div>
                <div class="masonry-item reveal" style="transition-delay: 0.4s;">
                    <div class="print-frame">
                        <img src="assets/brand_4.jpg" alt="Ethnic Wear Brand Campaign - Outdoor" class="print-img">
                    </div>
                </div>
                <div class="masonry-item reveal" style="transition-delay: 0.1s;">
                    <div class="print-frame">
                        <img src="assets/brand_5.jpg" alt="Ethnic Wear Brand Campaign - Lifestyle" class="print-img">
                    </div>
                </div>
                <div class="masonry-item reveal" style="transition-delay: 0.2s;">
                    <div class="print-frame">
                        <img src="assets/brand_6.jpg" alt="Ethnic Wear Brand Campaign - Bench" class="print-img">
                    </div>
                </div>
                <div class="masonry-item reveal" style="transition-delay: 0.30000000000000004s;">
                    <div class="print-frame">
                        <img src="assets/brand_7.jpg" alt="Ethnic Wear Brand Campaign - Showcase" class="print-img">
                    </div>
                </div>
                <div class="masonry-item reveal" style="transition-delay: 0.4s;">
                    <div class="print-frame">
                        <img src="assets/brand_8.jpg" alt="Ethnic Wear Brand Campaign - Seated" class="print-img">
                    </div>
                </div>
                <div class="masonry-item reveal" style="transition-delay: 0.1s;">
                    <div class="print-frame">
                        <img src="assets/brand_9.jpg" alt="Ethnic Wear Brand Campaign - Architecture" class="print-img">
                    </div>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 5rem;" class="reveal">
                <a href="index.html#portfolio" class="explore-cta">Back to Main Portfolio</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">
            <div style="font-family: 'Playfair Display', serif; font-size: 1.25rem;">Avinash Photography</div>
            <div style="font-family: 'Inter', sans-serif; font-size: 0.85rem; color: var(--text-muted);">&copy; 2026 &mdash; Capturing moments, telling stories.</div>
            <div class="social-links">
                <a href="https://www.instagram.com/avanish.heic/" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://www.linkedin.com/in/avinashcreates/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            </div>
            <div class="handwritten" style="margin-top: 1rem;">Thanks for looking.</div>
        </div>
    </footer>
    
    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox"></div>
</body>
</html>
